---
name: Build and Test

# TODO(@maltesander): The Trino integration suite (./test/setup.sh followed by
#                     ./test/run-tests.sh) is not run here. The Docker
#                     Trino + Postgres stack exceeds the standard GitHub
#                     runner. We can either try bigger runners or slim the
#                     stack down. Until then, run it locally before a release.
#                     Unit tests run on every PR below.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN_VERSION: "1.95.0"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      # odbc-sys links against libodbc/libodbcinst, so the unixODBC dev
      # libraries must be present to link the test binaries (no running Driver
      # Manager is needed — only the libraries).
      - name: Install host dependencies
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: unixodbc-dev
          version: ubuntu-latest

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust ${{ env.RUST_TOOLCHAIN_VERSION }} toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Run unit tests
        run: cargo test

  windows-cross-compile:
    name: Cross-compile Windows DLL
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Install MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust ${{ env.RUST_TOOLCHAIN_VERSION }} toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-gnu

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: windows-gnu

      - name: Build Windows DLL
        run: cargo build --target x86_64-pc-windows-gnu --release

      - name: Verify DLL exports
        run: |
          x86_64-w64-mingw32-objdump -p target/x86_64-pc-windows-gnu/release/stackable_odbc_trino.dll | grep -c "SQL" | xargs -I{} echo "Trino DLL: {} ODBC symbols exported"

  # Single required check for branch protection rules.
  finished:
    name: Finished Build and Test
    if: always()
    needs:
      - unit-tests
      - windows-cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.windows-cross-compile.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
