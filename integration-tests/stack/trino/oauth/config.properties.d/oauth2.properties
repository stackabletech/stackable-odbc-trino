# OIDC discovery is off, and every endpoint is named explicitly, because
# discovery is fetched from {issuer}/.well-known/openid-configuration and
# `localhost:8444` inside this container is Trino itself.
#
# The split is the point. `auth-url` is the only frontchannel URL and has to be
# reachable from the host, where the browser runs. `token-url` and `jwks-url`
# are the only backchannel URLs and have to be reachable from the compose
# network. `issuer` matches the `iss` claim Keycloak stamps, which derives from
# its KC_HOSTNAME and is the browser-facing form either way.
http-server.authentication.oauth2.oidc.discovery=false
http-server.authentication.oauth2.issuer=https://localhost:8444/realms/trino
http-server.authentication.oauth2.auth-url=https://localhost:8444/realms/trino/protocol/openid-connect/auth
http-server.authentication.oauth2.token-url=https://keycloak:8443/realms/trino/protocol/openid-connect/token
http-server.authentication.oauth2.jwks-url=https://keycloak:8443/realms/trino/protocol/openid-connect/certs

# `oidc.use-userinfo-endpoint` is deliberately absent. It belongs to the config
# class Trino binds only when discovery is enabled, so with discovery off airlift
# reports it as an unused property and the coordinator refuses to start. There is
# no userinfo endpoint to disable here: discovery is what would have supplied
# one.
http-server.authentication.oauth2.client-id=@OAUTH_CLIENT_ID@
http-server.authentication.oauth2.client-secret=@OAUTH_CLIENT_SECRET@
http-server.authentication.oauth2.scopes=openid

# The default is `sub`, a Keycloak UUID. `preferred_username` makes the session
# user `admin`, the same principal password.db and the client certificate
# resolve to, so a query's `current_user` is the same however it authenticated.
http-server.authentication.oauth2.principal-field=preferred_username
