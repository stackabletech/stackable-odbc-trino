protocol.spooling.enabled=true
protocol.spooling.shared-secret-key=@SPOOLING_SECRET@

# coordinator_proxy is the only mode that does not require the *client* to reach
# object storage, and the driver runs on the host where `minio` does not resolve.
# The default is storage, which hands the client a pre-signed URI naming the
# minio service by its compose name.
protocol.spooling.retrieval-mode=coordinator_proxy

# Far below the 8MB and 16MB defaults, so a few thousand rows produce several
# segments and the retrieval loop is exercised in seconds rather than needing
# tens of megabytes of result.
protocol.spooling.initial-segment-size=16kB
protocol.spooling.max-segment-size=64kB

# protocol.spooling.inlining is left at its default of enabled, because that is
# what a real deployment does. The consequence belongs in the test rather than in
# this file: the first 1000 rows, up to 128kB, come back inline, so a query has
# to exceed that before anything is spooled at all.
