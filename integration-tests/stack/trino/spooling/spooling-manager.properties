spooling-manager.name=filesystem
fs.location=s3://@SPOOLING_BUCKET@/
fs.s3.enabled=true

# Defaults to true, which is SSE-C. MinIO here serves plain HTTP inside the
# compose network with no key material configured, so segment encryption has to
# be off for a segment to be written at all.
fs.segment.encryption=false

s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.aws-access-key=@MINIO_ACCESS_KEY@
s3.aws-secret-key=@MINIO_SECRET_KEY@
# MinIO serves buckets as a path, not as a subdomain of the endpoint.
s3.path-style-access=true
