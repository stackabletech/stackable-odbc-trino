coordinator=true
node-scheduler.include-coordinator=true

# HTTPS only. The plaintext listener is off, so every client speaks TLS, and
# so does the coordinator's own discovery loop. OAuth 2.0 requires it
# ("Using TLS and a configured shared secret is required for OAuth 2.0
# authentication"), and it is what a real deployment looks like.
http-server.http.enabled=false
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino-secrets/tls/keystore.p12
http-server.https.keystore.key=changeit

# CERTIFICATE first, so a connection presenting a client certificate is
# authenticated by it and one that presents none falls through to PASSWORD.
# Setting the truststore is what makes the TLS layer ask for a client
# certificate at all. Without it Trino accepts the certificate at the
# transport layer and authenticates by password anyway, so a mutual-TLS test
# would prove only that a handshake completed.
http-server.authentication.type=CERTIFICATE,PASSWORD
http-server.https.truststore.path=/etc/trino-secrets/tls/truststore.p12
http-server.https.truststore.key=changeit

# The client certificate's subject is CN=admin, the same principal password.db
# holds, so the session user is the same however the connection authenticated.
http-server.authentication.certificate.user-mapping.pattern=CN=(.*)

internal-communication.shared-secret=trino-dev-shared-secret
# Required, not optional: with the plaintext listener off there is no HTTP
# internal URI, and without this Trino fails to start with
# "NullPointerException: internalUri is null". It also makes Trino generate a
# self-signed CN=<node.environment> certificate for internal communication,
# which Jetty serves as the default when a client sends no SNI, see the note
# in suites/test_tls.py about why that rules out testing by IP address.
internal-communication.https.required=true

# localhost inside the container is the coordinator itself, and the leaf
# carries DNS:localhost. Trusting it needs the CA in the JVM truststore; see
# jvm.config.
discovery.uri=https://localhost:8443
