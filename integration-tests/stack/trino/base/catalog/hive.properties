# The one connector Trino ships that accepts writes outside autocommit, which
# is what makes a transaction rollback observable at all. The gate is the SPI's
# Connector.isSingleStatementWritesOnly(), whose default body is `iconst_1;
# ireturn`; only trino-hive overrides it, from HiveConfig. base-jdbc (so
# postgresql), iceberg, delta-lake and memory all inherit the default, and a
# write inside a transaction against any of them answers
# AUTOCOMMIT_WRITE_CONFLICT.
#
# A file metastore needs neither a metastore service nor object storage, so
# this costs no container.
#
# The warehouse lives in the coordinator's own writable layer, under a parent
# the `trino` user can write, and Trino creates it on first use. A named volume
# would be mounted root-owned and the coordinator could not write it at all.
# Recreating the container therefore starts from an empty metastore, which is
# what scripts/seed-hive.sh runs on every setup to repair.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=file:///tmp/hive-warehouse
fs.hadoop.enabled=true

# Populates information_schema.table_privileges, which is what gives
# SQLTablePrivileges a non-empty result set and exercises
# metadata::table_privilege_row end to end.
hive.security=sql-standard
