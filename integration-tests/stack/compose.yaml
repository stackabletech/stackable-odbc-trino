services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: trino
      POSTGRES_PASSWORD: trino
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trino -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  trino:
    # Pinned, never `latest`. The floor is 466: the spooling protocol the
    # spooling profile needs did not exist before it.
    image: trinodb/trino:483
    ports:
      - "8443:8443"
    volumes:
      - ./trino/base:/etc/trino
      # Secrets mount at /etc/trino-secrets, NOT inside /etc/trino. Nesting a
      # bind mount inside another one makes Docker create the mount point on
      # the *host*, inside the checked-in config directory and owned by root --
      # which is where the stray password.db and tls/ entries came from.
      - ../generated/certs:/etc/trino-secrets/tls:ro
      - ../generated/password.db:/etc/trino-secrets/password.db:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # -k because curl inside the container has no reason to hold this CA, and
      # this is a liveness probe, not a TLS test. test_tls.py verifies the
      # certificate.
      test: ["CMD", "curl", "-fsk", "https://localhost:8443/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
